<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | Newaz Mursalin</title><link rel="stylesheet" href="../css/style.css">
  <style>
    .admin-wrap{max-width:520px;margin:70px auto;padding:28px;border:1px solid #292a32;border-radius:14px;background:#111218}
    label{display:block;margin:14px 0 6px;color:#c7c8ce;font-size:.9rem}
    input,textarea,select{width:100%;padding:12px;border-radius:7px;border:1px solid #393a44;background:#0b0c10;color:#fff;font:inherit}
    button{border:0;cursor:pointer;font:inherit;margin-top:18px;width:100%}
    .notice{color:#ff9aa7;min-height:24px;font-size:.9rem}.admin-link{color:#ff6477}
  </style>
</head>
<body>
  <header class="site-header"><a class="brand" href="../index.html">NEWAZ<span>.</span></a><a href="../index.html">View website ↗</a></header>
  <main class="admin-wrap">
    <p class="eyebrow">PRIVATE AREA</p><h1>Admin login</h1>
    <p class="muted">Sign in with the account you created in Firebase Authentication.</p>
    <form id="login-form">
      <label for="email">Email address</label><input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
      <button class="button primary" type="submit">Sign in</button>
      <p id="message" class="notice" role="status"></p>
    </form>
    <p class="muted">Never share your password. Admin access is restricted by your Firestore rules.</p>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script><script src="login.js"></script>
</body>
</html>
